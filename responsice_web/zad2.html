<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad 2</title>
    <style>
               * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #ddd;
  height: 100vh;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  gap: 5px;
}

 .a{
    background-color: orange;
 }
 .b{
    background-color: aqua;
 }
 .c{
    background-color: green;
 }
 .d{
    background-color: blueviolet;
 }
 .e{
    background-color: crimson;
 }
 .f{
    background-color: blue;
 }
 .g{
    background-color: bisque;
 }
 .h{
    background-color: black;
 }
 .i{
    background-color: brown;
 }
 .j{
    background-color: cadetblue;
 }
 .k{
    background-color: chartreuse;
 }
 .l{
    background-color: gold;
 }
 .container > div {
  width: 100%;
  height: 25%; 
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

@media (min-width:1024px){
    .container {
    flex-direction: row;
    flex-wrap: wrap;
  }
    .container > div {
    width: 20%;
    height: 50%;
  }
}
@media (min-width:768px) and (max-width: 1023px){
      .container {
    flex-direction: row;
    flex-wrap: wrap;
  }
    .container > div {
    height: 20%;
    width: 50vh;
  }
   
}
    </style>
</head>
<body>
   <div class="container">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>
    <div class="f"></div>
    <div class="g"></div>
    <div class="h"></div>
    <div class="i"></div>
    <div class="j"></div>
    <div class="k"></div>
    <div class="l"></div>
   </div>
</body>
</html>
