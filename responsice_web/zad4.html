<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zadatak 2</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #ddd;
  height: 100vh;
}

.container {
  display: flex;
  flex-direction: column;
  height: 50vh;
  gap: 2px;
}

.a { background: orangered; }
.b { background: orange; }
.c { background: gold; }
.d { background: yellowgreen; }
.e{ background: blue;}
.f{background: purple;}

.container > div {
  width: 100%;
  height: 25%; 
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}


@media (min-width: 768px) and (max-width:1023px){
  .container {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .container > div {
    width: 48%;
    height: 50%;
  }
}


@media (min-width: 1024px) {
  .container {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .container > div {
    width: 30%;
    height: 100%;
  }
}
</style>

</head>
<body>

<div class="container">
  <div class="a"> KORISNICI</div>
  <div class="b"> PRODAJA</div>
  <div class="c"> PORUKE</div>
  <div class="d">STATISTIKA</div>
  <div class="e"> ZADACI</div>
  <div class="f"> POSTAVKE</div>
</div>

</body>
</html>
