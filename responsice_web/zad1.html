<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Zadatak</title>
    <style>
        * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #ddd;
  height: 100vh;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  gap: 5px;
}

 .a,.b,.c,.d,.e,.f,.g,.h{
    background-color: orange;
    height: 50px;
    
 }
 .container > div {
  width: 100%;
  height: 25%; 
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

@media (min-width:1024px){
    .container {
    flex-direction: row;
    flex-wrap: wrap;
  }
    .container > div {
    width: 20%;
    height: 50%;
  }
}
@media (min-width:768px) and (max-width: 1023px){
      .container {
    flex-direction: column;
    flex-wrap: wrap;
  }
    .container > div {
    height: 20%;
    width: 100vh;
  }
   
}
    </style>
</head>
<body>
    <div class="container">
        <div class="a">Proizvod 1</div>
        <div class="b"> Proizvod 2</div>
        <div class="c">Proizvod 3</div>
        <div class="d">Proizvod 4</div>
        <div class="e">Proizvod 5</div>
        <div class="f">Proizvod 6</div>
        <div class="g">Proizvod 7</div>
        <div class="h">Proizvod 8</div>
    </div>
</body>
</html>
