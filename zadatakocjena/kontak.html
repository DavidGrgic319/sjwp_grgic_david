<section id="kontakt" class="py-5">

  <style>

    #kontakt {
      background:
      linear-gradient(rgba(0,0,0,0.7),
      rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600')
      center/cover no-repeat;
    }

    .kontakt-box {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .kontakt-box h2 {
      color: white;
      font-weight: bold;
    }

    .kontakt-box label {
      color: white;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: none;
    }

    .btn-kontakt {
      background: #0d6efd;
      border: none;
      padding: 12px 40px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .btn-kontakt:hover {
      transform: scale(1.05);
      background: #0b5ed7;
    }

  </style>

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="kontakt-box">

          <h2 class="text-center mb-4">Kontaktirajte me</h2>

          <form method="GET">

            <div class="row">

              <div class="col-md-6 mb-3">

                <label>Ime</label>
                <input type="text" class="form-control" placeholder="Unesite ime" required>

              </div>

              <div class="col-md-6 mb-3">

                <label>Email</label>
                <input type="email" class="form-control" placeholder="Unesite email" required>

              </div>

            </div>

            <div class="mb-3">

              <label>Datum</label>
              <input type="date" class="form-control" required>

            </div>

            <div class="mb-4">

              <label>Poruka</label>
              <textarea class="form-control" rows="6" placeholder="Unesite poruku" required></textarea>

            </div>

            <div class="text-center">

              <button type="submit" class="btn btn-kontakt btn-lg">
                Pošalji Poruku
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</section>
